name: 機能要望
description: 新しい表示情報や動作の改善を提案する
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと
      description: 機能そのものではなく、現在困っていることや利用場面を記載してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する動作
      description: OBS上での表示や設定方法を含め、期待する動作を記載してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 現在の回避策や、検討した別の方法があれば記載してください。

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 同じ内容のIssueがないことを確認しました。
          required: true
        - label: コントリビューションガイドに記載された現在の対応範囲を確認しました。
          required: true
