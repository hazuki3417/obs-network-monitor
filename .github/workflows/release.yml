name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-build:
    name: Test and build Windows release
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH format: $env:GITHUB_REF_NAME"
          }

          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tagged commit is not contained in the main branch."
          }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -o dist/obs-network-monitor.exe .
          if (-not (Test-Path dist/obs-network-monitor.exe)) {
            throw "Windows executable was not created."
          }

      - name: Run Windows integration smoke tests
        shell: pwsh
        run: ./.github/scripts/windows-smoke-test.ps1 -ExecutablePath ./dist/obs-network-monitor.exe

      - name: Package release
        shell: pwsh
        run: |
          $package = "dist/obs-network-monitor-windows-x64"
          $archive = "dist/obs-network-monitor-windows-x64.zip"
          $checksum = "$archive.sha256"

          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item dist/obs-network-monitor.exe $package/
          Copy-Item config.example.json $package/
          Copy-Item README.md $package/
          Compress-Archive -Path "$package/*" -DestinationPath $archive

          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  obs-network-monitor-windows-x64.zip" |
            Set-Content -Path $checksum -Encoding ascii

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/obs-network-monitor-windows-x64.zip
            dist/obs-network-monitor-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="dist/obs-network-monitor-windows-x64.zip"
          checksum="${archive}.sha256"

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${archive}" "${checksum}" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" "${archive}" "${checksum}" \
              --verify-tag \
              --generate-notes \
              --title "OBS Network Monitor ${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
