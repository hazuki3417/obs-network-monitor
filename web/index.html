<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OBS Network Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <div class="title">NETWORK</div>
    <div class="row"><span>Status</span><strong id="status">CONNECTING</strong></div>
    <div class="row"><span>Latency</span><strong id="latency">-- ms</strong></div>
    <div class="row"><span>Updated</span><strong id="updated">--:--:--</strong></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
