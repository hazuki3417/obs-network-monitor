<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OBS Network Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel" id="monitor-panel">
    <h2 class="section-title latency-title">LATENCY</h2>

    <section class="metrics" id="latency-metrics" aria-label="回線測定値">
      <div class="metric">
        <span class="label">LATENCY</span>
        <div><strong id="latency">--</strong><span class="unit">ms</span></div>
      </div>
      <div class="metric">
        <span class="label">JITTER</span>
        <div><strong id="jitter">--</strong><span class="unit">ms</span></div>
      </div>
      <div class="metric">
        <span class="label" id="failure-label">PACKET LOSS</span>
        <div><strong id="failure-rate">--</strong><span class="unit">%</span></div>
      </div>
      <div class="metric">
        <span class="label">FAIL STREAK</span>
        <div><strong id="consecutive-failures">0</strong></div>
      </div>
    </section>

    <section class="latency-summary" id="latency-summary" aria-label="直近60回の遅延統計">
      <div>
        <span class="label">AVG LATENCY</span>
        <strong><span id="average-latency">--</span> <small>ms</small></strong>
      </div>
      <div>
        <span class="label">MIN LATENCY</span>
        <strong><span id="minimum-latency">--</span> <small>ms</small></strong>
      </div>
      <div>
        <span class="label">MAX LATENCY</span>
        <strong><span id="maximum-latency">--</span> <small>ms</small></strong>
      </div>
    </section>

    <section class="chart-card latency-chart-card" id="latency-chart" aria-label="遅延グラフ">
      <svg class="chart" id="latency-chart-svg" viewBox="-36 0 516 112" role="img" aria-label="直近60回の遅延グラフ">
        <line class="grid-line" x1="0" y1="1" x2="480" y2="1"></line>
        <line class="grid-line" x1="0" y1="56" x2="480" y2="56"></line>
        <line class="grid-line" x1="0" y1="111" x2="480" y2="111"></line>
        <path id="latency-path" d=""></path>
        <g class="chart-axis" aria-hidden="true">
          <text id="latency-axis-maximum" class="axis-label" x="-8" y="10" text-anchor="end">--</text>
          <text id="latency-axis-middle" class="axis-label" x="-8" y="60" text-anchor="end">--</text>
          <text class="axis-label" x="-8" y="111" text-anchor="end">0</text>
          <text id="latency-overlay-maximum" class="axis-maximum" x="472" y="14" text-anchor="end">-- ms</text>
        </g>
        <text id="chart-empty" x="240" y="61" text-anchor="middle">成功した測定を待っています</text>
      </svg>
    </section>

    <h2 class="section-title traffic-title">NIC TRAFFIC</h2>

    <section class="chart-card traffic-card" id="traffic-section" aria-label="NIC通信量">
      <div class="traffic-current">
        <div>
          <span class="traffic-key transmit" aria-hidden="true"></span>
          <span class="label">UPLOAD</span>
          <strong id="tx-traffic">--</strong>
        </div>
        <div>
          <span class="traffic-key receive" aria-hidden="true"></span>
          <span class="label">DOWNLOAD</span>
          <strong id="rx-traffic">--</strong>
        </div>
      </div>
      <svg class="chart traffic-chart" id="traffic-chart-svg" viewBox="-36 0 516 96" role="img" aria-label="直近60回のNIC送受信速度グラフ">
        <line class="grid-line" x1="0" y1="1" x2="480" y2="1"></line>
        <line class="grid-line" x1="0" y1="48" x2="480" y2="48"></line>
        <line class="grid-line" x1="0" y1="95" x2="480" y2="95"></line>
        <path id="traffic-transmit-path" class="traffic-path transmit" d=""></path>
        <path id="traffic-receive-path" class="traffic-path receive" d=""></path>
        <g class="chart-axis" aria-hidden="true">
          <text id="traffic-axis-maximum" class="axis-label" x="-8" y="10" text-anchor="end">--</text>
          <text id="traffic-axis-middle" class="axis-label" x="-8" y="52" text-anchor="end">--</text>
          <text class="axis-label" x="-8" y="95" text-anchor="end">0</text>
          <text id="traffic-overlay-maximum" class="axis-maximum" x="472" y="14" text-anchor="end">--</text>
        </g>
        <text id="traffic-chart-empty" x="240" y="53" text-anchor="middle">通信量を測定しています</text>
      </svg>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
